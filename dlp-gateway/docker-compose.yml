services:
  gateway:
    build: .
    container_name: dlp-gateway
    env_file:
      - .env
    ports:
      - "25:2525"
      - "8080:8080"
    volumes:
      - /var/dlp/spool:/var/dlp/spool
      - /var/dlp/data:/var/dlp/data
      - /var/dlp/queues:/var/dlp/queues
      - /opt/dlp-gateway/certs/fullchain.pem:/certs/fullchain.pem:ro
      - /opt/dlp-gateway/certs/privkey.pem:/certs/privkey.pem:ro
      # Optional Microsoft return client certs (adapter=microsoft). Leave commented until the
      # host PEMs exist — bind-mounting missing paths creates empty dirs and breaks AWS/local staging.
      # - /opt/dlp-gateway/certs/m365-client-fullchain.pem:/certs/m365-client-fullchain.pem:ro
      # - /opt/dlp-gateway/certs/m365-client-privkey.pem:/certs/m365-client-privkey.pem:ro
    depends_on:
      - mailhog
      - azurite
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: dlp-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.33.0
    container_name: dlp-azurite
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --location /data --debug /data/debug.log --skipApiVersionCheck
    ports:
      - "10000:10000"
    volumes:
      - azurite_data:/data
    restart: unless-stopped

volumes:
  azurite_data:
