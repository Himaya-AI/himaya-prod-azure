<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Himaya Secure Sandbox</title>
  <style>
    html, body { margin:0; height:100%; background:#0b1424;
                 font-family:'Segoe UI', Roboto, Arial, sans-serif; color:#c7d2e0; }
    .wrap { min-height:100%; display:flex; flex-direction:column;
            align-items:center; justify-content:center; text-align:center; padding:40px; }
    .wrap img { width:260px; max-width:60vw; margin-bottom:28px; }
    .wrap h1 { font-size:20px; font-weight:600; margin:0 0 10px; color:#e8eef7; letter-spacing:.3px; }
    .wrap p { font-size:14px; color:#8ea3bd; margin:4px 0; max-width:560px; line-height:1.5; }
    .badge { margin-top:22px; font-size:12px; color:#5b6b82; letter-spacing:.5px;
             border:1px solid #1f3350; border-radius:20px; padding:6px 16px; }
  </style>
</head>
<body>
  <div class="wrap">
    <img src="himaya_logo.png" alt="Himaya">
    <h1>Secure Analysis Environment</h1>
    <p>This is an isolated sandbox. The email under investigation will load here when the session begins.</p>
    <div class="badge">Isolated &middot; Ephemeral &middot; Monitored</div>
  </div>
</body>
</html>
